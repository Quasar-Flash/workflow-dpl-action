name: Deploy Fargate PRD
on:
  workflow_call:
    inputs:
      dockerfile_location:
        required: false
        type: string
        default: "."
      environment:
        default: "fargate-prd"
        required: false
        type: string
      environment_url:
        required: true
        type: string
      release:
        default: "false"
        required: false
        type: string
      envfile_to_env:
        default: "false"
        required: false
        type: string
      app_location:
        default: "app/"
        required: false
        type: string
      ecs_service_name:
        description: "Nome do ECS service a atualizar, se diferente do nome do repositorio (ex: variante -alb-canario)"
        default: ""
        required: false
        type: string
    secrets:
      AWS_FARGATE_DEVOPS_ROLE_NAME:
        required: true
      AWS_FARGATE_PRD_ROLE_NAME:
        required: true
      EKS_TEMPLATES_CHECKOUT_PAT:
        required: true
jobs:
  Deploying:
    if: ${{ contains(fromJSON(vars.DEPLOYMENT_USERS), github.actor) == true }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment_url }}
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@master
      - name: Instala o Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Configura as credenciais da AWS (DevOps - us-east-1)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_FARGATE_DEVOPS_ROLE_NAME }}
      - name: Autentica com o AWS ECR (us-east-1)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: Atribui variaveis de ambiente para realizar os uploads
        id: vars
        run: |
          echo "branch_name=${{ steps.extract_branch.outputs.branch }}" >> $GITHUB_OUTPUT
          echo "release_timestamp=$(date +%s)" >> $GITHUB_OUTPUT
          echo "project_version=$(cat .version 2>/dev/null || echo '0.0.0')" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "repo_name=${GITHUB_REPOSITORY#*\/}" >> $GITHUB_OUTPUT
          echo "ecr_registry=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT
          echo "ecr_tag=${{ steps.login-ecr.outputs.registry }}/${GITHUB_REPOSITORY#*\/}:prd-${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "ecr_tag_latest=${{ steps.login-ecr.outputs.registry }}/${GITHUB_REPOSITORY#*\/}:prd-latest" >> $GITHUB_OUTPUT
      - name: Recupera o historico da versao para a criacao da release
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_depth: 10
          version: ${{ steps.vars.outputs.project_version }}
          path: ./CHANGELOG.md
      - name: Configura o arquivo .env estatico de acordo com o ambiente
        if: ${{ inputs.envfile_to_env != 'false' }}
        run: |
          mv ${{ inputs.envfile_to_env }} ${{ inputs.app_location }}.env
          rm ${{ inputs.app_location }}.env.*
      - name: Constroi a imagem e faz upload para o AWS ECR (us-east-1)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.dockerfile_location }}
          push: true
          tags: "${{ steps.vars.outputs.ecr_tag_latest }},${{ steps.vars.outputs.ecr_tag }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            "BRANCH_NAME=${{ steps.vars.outputs.branch_name }}"
            "ENVIRONMENT=production"
      - name: Configura as credenciais da AWS (Prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_FARGATE_PRD_ROLE_NAME }}
      - name: Checkout do repositorio de templates
        uses: actions/checkout@master
        with:
          repository: ${{ vars.EKS_TEMPLATES_REPO }}
          path: "target"
          token: ${{ secrets.EKS_TEMPLATES_CHECKOUT_PAT }}
      - name: Instala dependencias Python para preprocess
        run: |
          python3 -m pip install --quiet pyyaml
      - name: Coleta SSM (valores /common/* + nomes globais para orphan filter)
        env:
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: "12"
        run: |
          echo "[]" > /tmp/common-values.json
          NEXT=""
          PAGE=0
          ACCUM="[]"
          while : ; do
            if [ -z "$NEXT" ]; then
              OUT=$(aws ssm get-parameters-by-path --path /common --recursive --with-decryption --max-results 10)
            else
              OUT=$(aws ssm get-parameters-by-path --path /common --recursive --with-decryption --max-results 10 --next-token "$NEXT")
            fi
            ACCUM=$(echo "$ACCUM" "$OUT" | jq -s '.[0] + (.[1].Parameters // [])')
            NEXT=$(echo "$OUT" | jq -r '.NextToken // empty')
            PAGE=$((PAGE+1))
            [ -z "$NEXT" ] && break
            [ "$PAGE" -ge 500 ] && { echo "ERRO: paginacao /common excedeu 500 paginas"; exit 1; }
            sleep 0.3
          done
          echo "$ACCUM" > /tmp/common-values.json
          echo "common SSM values: $(jq 'length' /tmp/common-values.json)"

          : > /tmp/ssm-prd-real.txt
          NEXT=""
          while : ; do
            if [ -z "$NEXT" ]; then
              OUT=$(aws ssm describe-parameters --max-results 50)
            else
              OUT=$(aws ssm describe-parameters --max-results 50 --next-token "$NEXT")
            fi
            echo "$OUT" | jq -r '.Parameters[].Name' >> /tmp/ssm-prd-real.txt
            NEXT=$(echo "$OUT" | jq -r '.NextToken // empty')
            [ -z "$NEXT" ] && break
            sleep 0.3
          done
          sort -u /tmp/ssm-prd-real.txt -o /tmp/ssm-prd-real.txt
          echo "ssm_real total: $(wc -l < /tmp/ssm-prd-real.txt)"

      - name: Gera /tmp/common.env (envs.prod.yml secretKey -> valor SSM) e upload S3
        id: envfile
        env:
          BUCKET: qflash-prd-fargate-envfiles
        run: |
          python3 <<'PYEOF'
          import yaml, json
          with open("target/services/envs.prod.yml") as f:
              lines = [l for l in f if not l.lstrip().startswith("#@")]
          d = yaml.safe_load("".join(lines))
          items = d.get("spec",{}).get("data",[])
          values = {p["Name"]: p["Value"] for p in json.load(open("/tmp/common-values.json"))}
          lines_out = []
          skipped = []
          for it in items:
              key = it["remoteRef"]["key"]
              name = it["secretKey"]
              if not key.startswith("/common/"):
                  continue
              v = values.get(key)
              if v is None:
                  skipped.append((name, key, "missing-ssm")); continue
              if "\n" in v or "\r" in v:
                  skipped.append((name, key, "multiline")); continue
              if v == "":
                  skipped.append((name, key, "empty")); continue
              lines_out.append(f"{name}={v}")
          with open("/tmp/common.env","w") as fp:
              fp.write("\n".join(lines_out) + "\n")
          print(f"common.env: {len(lines_out)} vars, {len(skipped)} puladas")
          for s in skipped:
              print(f"  SKIP: {s[0]} ({s[1]}) reason={s[2]}")
          PYEOF
          size=$(wc -c < /tmp/common.env)
          echo "common.env size: $size bytes"
          aws s3 cp /tmp/common.env "s3://$BUCKET/common.env" --no-progress
          ENVFILE_ARN="arn:aws:s3:::$BUCKET/common.env"
          echo "envfile_arn=$ENVFILE_ARN" >> "$GITHUB_OUTPUT"
          echo "ENVFILE_ARN=$ENVFILE_ARN"
      - name: Preprocessa envs.prod.yml + ssm_real para ytt data values
        run: |
          python3 <<'PYEOF'
          import yaml
          with open("target/services/envs.prod.yml") as f:
              lines = [l for l in f if not l.lstrip().startswith("#@")]
          d = yaml.safe_load("".join(lines))
          out_envs = {"envs_common": [
              {"secretKey": i["secretKey"], "remoteRef": {"key": i["remoteRef"]["key"]}}
              for i in d.get("spec",{}).get("data",[])
          ]}
          with open("/tmp/envs_common_data.yml","w") as fp:
              fp.write("#@data/values\n#@overlay/match-child-defaults missing_ok=True\n---\n")
              fp.write(yaml.dump(out_envs, default_flow_style=False))
          with open("/tmp/ssm-prd-real.txt") as fp:
              paths = [l.strip() for l in fp if l.strip()]
          with open("/tmp/ssm_real_data.yml","w") as fp:
              fp.write("#@data/values\n#@overlay/match-child-defaults missing_ok=True\n---\nssm_real:\n")
              for p in paths:
                  fp.write(f"- {p}\n")
          print(f"envs_common: {len(out_envs['envs_common'])}, ssm_real: {len(paths)}")
          PYEOF
      - name: Renderiza Task Definition via ytt
        id: render-td
        run: |
          chmod +x target/bin/ytt
          target/bin/ytt \
            -f target/services/fargate-helpers.lib.yml \
            -f target/services/fargate-template.yml \
            -f target/services/defaults.fargate-prd.yml \
            -f target/services/${{ steps.vars.outputs.repo_name }}/values.prod.yml \
            -f /tmp/envs_common_data.yml \
            -f /tmp/ssm_real_data.yml \
            --data-value image_uri="${{ steps.vars.outputs.ecr_tag }}" \
            --data-value envfile_arn="${{ steps.envfile.outputs.envfile_arn }}" \
            > /tmp/td.yaml
          python3 -c "import yaml,json; d=yaml.safe_load(open('/tmp/td.yaml')); json.dump(d, open('/tmp/td.json','w'))"
          echo "Task Definition tamanho: $(wc -c < /tmp/td.json) bytes (limite 65536)"
          echo "Secrets: $(python3 -c "import json; print(len(json.load(open('/tmp/td.json'))['containerDefinitions'][0].get('secrets',[])))")"
      - name: Register Task Definition
        id: reg-td
        run: |
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "td_arn=$NEW_ARN" >> $GITHUB_OUTPUT
          echo "Nova revisao registrada: $NEW_ARN"
      - name: Update ECS Service
        run: |
          SERVICE_NAME="${{ inputs.ecs_service_name }}"
          if [ -z "$SERVICE_NAME" ]; then SERVICE_NAME="${{ steps.vars.outputs.repo_name }}"; fi
          aws ecs update-service \
            --cluster qflash-prd-fargate \
            --service "$SERVICE_NAME" \
            --task-definition "${{ steps.reg-td.outputs.td_arn }}" \
            --force-new-deployment \
            > /dev/null
          echo "Service atualizado: $SERVICE_NAME"
      - name: Aguarda services-stable
        timeout-minutes: 8
        run: |
          SERVICE_NAME="${{ inputs.ecs_service_name }}"
          if [ -z "$SERVICE_NAME" ]; then SERVICE_NAME="${{ steps.vars.outputs.repo_name }}"; fi
          aws ecs wait services-stable \
            --cluster qflash-prd-fargate \
            --services "$SERVICE_NAME"
          echo "Service estavel"
      - name: Cria a release no Github para a versao
        if: ${{ inputs.release == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.vars.outputs.project_version }}-fargate
          name: v${{ steps.vars.outputs.project_version }} (Fargate)
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          draft: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Purge old cache
        uses: MyAlbum/purge-cache@v2
        with:
          debug: true
          max-age: 604800
